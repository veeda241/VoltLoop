; VoltLoop ESP32 firmware — two roles, one codebase.
;   pio run -e vehicle
;   pio run -e rsu
;   pio run -e vehicle -t upload

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
lib_deps =

[env:vehicle]
build_flags =
  ${env.build_flags}
  -DVL_ROLE_VEHICLE=1

[env:rsu]
build_flags =
  ${env.build_flags}
  -DVL_ROLE_RSU=1
